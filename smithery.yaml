# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - v2exApiKey
    properties:
      v2exApiKey:
        type: string
        description: V2EX API token for authenticating API calls
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'node', args: ['dist/index.js'], env: { V2EX_API_KEY: config.v2exApiKey } })
  exampleConfig:
    v2exApiKey: your-token-here
